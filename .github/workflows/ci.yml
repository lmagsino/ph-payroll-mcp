name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true

      - name: Validate rate tables
        run: bundle exec ruby bin/validate_tables

      - name: RSpec
        run: bundle exec rspec

  gem:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    defaults:
      run:
        working-directory: gem
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gem

      - name: RSpec
        run: bundle exec rspec

      - name: Build
        run: gem build ph_payroll.gemspec
