name: Yearly rate check

# Opens the yearly maintenance issues (docs/MAINTAINING.md):
#   2 January  — "Re-verify <year> rates"
#   1 October  — "Load the <next year> holiday calendar" (the proclamation for the coming
#                year is usually out by September)
# workflow_dispatch exists so either issue can be opened by hand, or the jobs tested.
on:
  schedule:
    - cron: "0 1 2 1 *"
    - cron: "0 1 1 10 *"
  workflow_dispatch:
    inputs:
      check:
        description: Which issue to open
        type: choice
        options: [rates, holidays]

permissions:
  issues: write

jobs:
  rates:
    if: github.event.schedule == '0 1 2 1 *' || inputs.check == 'rates'
    runs-on: ubuntu-latest
    steps:
      - name: Open the re-verification issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          year=$(date -u +%Y)
          title="Re-verify ${year} rates"
          if gh issue list --state open --search "\"${title}\" in:title" --json title --jq '.[].title' | grep -qx "${title}"; then
            echo "already open: ${title}"; exit 0
          fi
          cat > body.md <<BODY
          Yearly check that every rate table still matches its agency issuance for ${year}.
          Steps: [docs/MAINTAINING.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/MAINTAINING.md) and
          [VERIFICATION.md → How to re-verify](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/VERIFICATION.md#how-to-re-verify-next-year).

          - [ ] SSS: schedule circular and EC bands (sss.gov.ph circulars)
          - [ ] PhilHealth: premium rate, floor, ceiling (circulars and advisories)
          - [ ] Pag-IBIG: rates and fund-salary ceiling; retry HDMF's own Circular 460 copy
          - [ ] BIR: monthly withholding table and the 13th-month ceiling (Revenue Regulations)
          - [ ] Premium pay: newest DOLE Handbook edition and the year's holiday-pay labor advisory
          - [ ] VERIFICATION.md check dates updated, primary/secondary re-marked honestly
          - [ ] gem/CHANGELOG.md Rates entry, even if nothing changed
          - [ ] Gem patch released if a table changed (ph_payroll/v* tag)
          BODY
          gh issue create --title "${title}" --body-file body.md

  holidays:
    if: github.event.schedule == '0 1 1 10 *' || inputs.check == 'holidays'
    runs-on: ubuntu-latest
    steps:
      - name: Open the holiday-calendar issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          year=$(( $(date -u +%Y) + 1 ))
          title="Load the ${year} holiday calendar"
          if gh issue list --state open --search "\"${title}\" in:title" --json title --jq '.[].title' | grep -qx "${title}"; then
            echo "already open: ${title}"; exit 0
          fi
          cat > body.md <<BODY
          Until a ${year} table is loaded, every ${year} date is refused by compute_holiday_pay
          and list_holidays rather than priced as an ordinary day.

          - [ ] Find the proclamation declaring the ${year} regular holidays and special days (lawphil, Official Gazette)
          - [ ] Add a holidays.yml table: effective_date ${year}-01-01, year ${year}, every date typed and cited
          - [ ] Note dates that differ from the statutory default (e.g. "Monday nearest" not applied)
          - [ ] VERIFICATION.md holiday rows for ${year}
          - [ ] Eid'l Fitr and Eid'l Adha are proclaimed separately during ${year}: keep this issue open and add each when issued
          - [ ] gem/CHANGELOG.md Rates entry and a gem patch release
          BODY
          gh issue create --title "${title}" --body-file body.md
