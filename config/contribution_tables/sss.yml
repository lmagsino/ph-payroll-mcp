# SSS schedule effective January 2025, still the schedule in force for 2026 (no later
# contribution-schedule circular on sss.gov.ph as of 2026-10-14). Figures checked row by
# row against the circular PDFs; see docs/VERIFICATION.md.
#   - wisp_threshold is the circular's MPF (Mandatory Provident Fund) boundary.
#   - Brackets are uniform ₱500 MSC steps: compensation MSC−250 … MSC+249.99 maps to MSC.
#   - ec_threshold is an MSC, not a compensation figure: EC is ₱30 from MSC ₱15,000,
#     i.e. from compensation ₱14,750. The "₱14,500" seen in secondary sources is the
#     last MSC that still pays ₱10.
agency: sss
tables:
  - effective_date: "2026-01-01"
    source_circular: "SSS Circular No. 2024-006 (employers and employees), with Circulars 2024-008/-009/-010 (self-employed, voluntary, land-based OFW) — schedule effective January 2025"
    data:
      msc_floor: "5000"
      msc_ceiling: "35000"
      msc_step: "500"
      ofw_msc_floor: "8000"
      wisp_threshold: "20000"
      rate_total: "0.15"
      rate_employer: "0.10"
      rate_employee: "0.05"
      ec_low: "10"
      ec_high: "30"
      ec_threshold: "15000"
